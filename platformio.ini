; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
    ; Pinned. The release workflow publishes images that clocks install, so a
    ; CI build has to reproduce a local one - otherwise the edge channel moves
    ; whenever something upstream does, and a fault seen in the field cannot be
    ; reproduced. Raise these deliberately, then rebuild and check.
    ;
    ; This is the pioarduino fork, not the platform of the same name in the
    ; PlatformIO registry. The registry one is at 6.12.0 and carries Arduino
    ; core 2.0.x; the fork carries 3.3.x, which this code needs. Plain
    ; `platform = espressif32` resolves to whichever is installed - locally the
    ; fork, on a clean CI runner the registry version - so it has to be the URL.
    ; Tag 55.03.37 = Arduino core 3.3.7 / ESP-IDF 5.5.2.
    platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
    board = seeed_xiao_esp32s3
    framework = arduino
    board_build.filesystem = littlefs

    ; The board definition targets the 8 MB XIAO ESP32-S3; this is the Plus
    ; variant with 16 MB, so override the flash size and partition table.
    board_upload.flash_size = 16MB
    board_upload.maximum_size = 16777216
    board_build.partitions = partitions.csv

    ; The XIAO has no USB-serial converter: the ESP32-S3's own USB-Serial/JTAG
    ; is the port (VID 303A, PID 1001). Entering the download mode detaches that
    ; USB device and enumerates it again, and the handle esptool already holds
    ; on COMx points nowhere afterwards - "Cannot configure port" and Windows
    ; error 31, which reads like a broken cable and is not one. `usb-reset`
    ; waits for the device to come back; the `default-reset` the board
    ; definition asks for cannot. Written as board_upload rather than as
    ; upload_flags because the builder substitutes it into the middle of the
    ; command line: with esptool 5 `--before` has to come before `write-flash`,
    ; and appended flags land after it, where the option does not exist.
    board_upload.before_reset = usb-reset

    ; Stamps FIRMWARE_VERSION from `git describe --tags`; falls back to the
    ; value in src/Version.h when the working copy has no tags.
    extra_scripts = pre:scripts/version.py

    ; PSRAM is switched off, and it has to stay off.
    ;
    ; The XIAO ESP32-S3 Plus carries 8 MB of octal (OPI) PSRAM and the board
    ; definition turns it on with -DBOARD_HAS_PSRAM. With it on, this firmware
    ; dies on every boot the moment WiFi brings the radio up:
    ;
    ;   esp_phy_enable <- pm_wake_up <- ieee80211_ioctl_process <- ppTask
    ;   Guru Meditation Error: Cache error - MMU entry fault
    ;
    ; The cache fault takes the other core with it: every instruction fetched
    ; from flash then returns rubbish, so core 1 panics with an
    ; InstructionFetchError on a nonsense address and a corrupted backtrace.
    ; That second panic is the one that shows up first and it is a red herring -
    ; the address it jumps to tracks _heap_start, which is what gives it away.
    ;
    ; The clock allocates 136 bytes of PSRAM, so there is nothing to lose here.
    ; memory_type picks the prebuilt IDF variant (quad flash, no PSRAM), and
    ; extra_flags repeats the board's own list minus BOARD_HAS_PSRAM - there is
    ; no way to drop a single flag, the list has to be restated.
    board_build.arduino.memory_type = qio_qspi
    board_build.extra_flags =
        -DARDUINO_XIAO_ESP32S3
        -DARDUINO_USB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=1
        -DARDUINO_RUNNING_CORE=1
        -DARDUINO_EVENT_RUNNING_CORE=1

    build_flags =
        -DLED_OUTPUT_PIN=4
    ; Pinned to exact commits, in this order:
    ;   WiFiManager 2.0.17, Timezone 1.2.4, Time 1.6.1, ArduinoJson 7.4.1,
    ;   FastLED 3.9.15, VEML7700 2.1.6, RemoteDebug 4.0.1
    ; Adafruit BusIO is a dependency of the VEML7700 library rather than
    ; something this code includes; it comes from the registry, so it is pinned
    ; by version rather than by commit like the rest.
    ; BH1750 is gone with the LDR class it belonged to: behind a dark front
    ; panel it resolves 1 lx where the interesting range is fractions of one.
    ; NtpClientLib is gone: the core's own SNTP does the job, and that library
    ; dragged in a second copy of Time whose deprecated Time.h shadowed
    ; <time.h> for the whole build.
    ; (U8g2 used to be listed here as "nice to have" but is included by nothing,
    ; so it only ever cost a download.)
    lib_deps =
        https://github.com/tzapu/WiFiManager#32655b7
        https://github.com/JChristensen/Timezone#7cf1425
        https://github.com/PaulStoffregen/Time#a18e50d
        https://github.com/bblanchon/ArduinoJson#3252013
        https://github.com/FastLED/FastLED#084f1f5
        https://github.com/adafruit/Adafruit_VEML7700#0dc00fa
        adafruit/Adafruit TSL2591 Library@1.4.5
        adafruit/Adafruit BusIO@1.17.4
        https://github.com/karol-brejna-i/RemoteDebug#68302f5

    upload_protocol = esptool
    upload_speed = 460800
    monitor_speed = 115200
