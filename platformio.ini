; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
    platform = espressif32
    board = seeed_xiao_esp32s3
    framework = arduino
    board_build.filesystem = littlefs

    ; The board definition targets the 8 MB XIAO ESP32-S3; this is the Plus
    ; variant with 16 MB, so override the flash size and partition table.
    board_upload.flash_size = 16MB
    board_upload.maximum_size = 16777216
    board_build.partitions = partitions.csv

    build_flags =
        -DLED_OUTPUT_PIN=4
    lib_deps =
        https://github.com/tzapu/WiFiManager
        https://github.com/gmag11/NtpClient
        https://github.com/JChristensen/Timezone
        https://github.com/PaulStoffregen/Time
        https://github.com/bblanchon/ArduinoJson
        https://github.com/FastLED/FastLED
        https://github.com/claws/BH1750
        https://github.com/karol-brejna-i/RemoteDebug
        ; Some nice to have libraries
        olikraus/U8g2

    upload_protocol = esptool
    upload_speed = 460800
    monitor_speed = 115200
