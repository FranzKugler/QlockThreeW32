name: qlockthreew32-dev

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        DEV_UID: "1001"
        DEV_GID: "1001"
        PLATFORMIO_VERSION: "6.1.19"
        UV_VERSION: "0.12.5"
        CLAUDE_CODE_VERSION: "2.1.246"
    image: qlockthreew32-dev:local
    init: true
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ..:/workspace
      - platformio-cache:/home/developer/.platformio
      - npm-cache:/home/developer/.npm
      - claude-state:/home/developer/.claude
    # Ports bind only to loopback. Host 18080 avoids the existing Signal
    # gateway on 127.0.0.1:8080; inside the container the mock still uses 8080.
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:18080:8080"
    environment:
      HOME: /home/developer
      PLATFORMIO_CORE_DIR: /home/developer/.platformio
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024

volumes:
  platformio-cache:
  npm-cache:
  claude-state:
